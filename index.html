<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3: Form đăng ký sinh viên</title>
 
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
       
        <span class="badge-label">Đăng Ký Mới</span>

        <h2 class="form-title">ĐĂNG KÝ THÔNG TIN SINH VIÊN</h2>

        <form action="#" method="POST">
            
   
            <div class="row-dual">
                <div class="form-group">
                    <label class="field-label" for="fullname">Họ và tên *</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label class="field-label" for="email">Địa chỉ Email *</label>
                    <input type="email" id="email" name="email" placeholder="example@phenikaa.edu.vn" required>
                </div>
            </div>

           
            <div class="row-dual">
                <div class="form-group">
                    <label class="field-label" for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="0987654321">
                </div>
                <div class="form-group">
                    <label class="field-label" for="major">Chuyên ngành</label>
                    <select id="major" name="major">
                        <option value="ecommerce">Thương mại điện tử</option>
                        <option value="it">Công nghệ thông tin</option>
                        <option value="marketing">Digital Marketing</option>
                        <option value="logistics">Logistics & Chuỗi cung ứng</option>
                    </select>
                </div>
            </div>

           
            <div class="form-group">
                <label class="field-label">Giới tính</label>
                <div class="options-group">
                    <label class="option-item">
                        <input type="radio" name="gender" value="nam" checked> Nam
                    </label>
                    <label class="option-item">
                        <input type="radio" name="gender" value="nu"> Nữ
                    </label>
                    <label class="option-item">
                        <input type="radio" name="gender" value="khac"> Khác
                    </label>
                </div>
         
            <div class="form-group">
                <label class="field-label">Lĩnh vực quan tâm</label>
                <div class="options-group">
                    <label class="option-item">
                        <input type="checkbox" name="interests" value="web"> Thiết kế Web
                    </label>
                    <label class="option-item">
                        <input type="checkbox" name="interests" value="ai"> Trí tuệ nhân tạo
                    </label>
                    <label class="option-item">
                        <input type="checkbox" name="interests" value="business"> Kinh doanh số
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="field-label" for="notes">Ghi chú thêm</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Nguyện vọng hoặc thông tin bổ sung..."></textarea>
            </div>

            
            <div class="button-group">
                <button type="reset">Nhập lại</button>
                <button type="submit">Đăng ký</button>
            </div>

        </form>

    </div>

</body>
</html>
